    <!-- Tidio chat: deferred until first user interaction (or 6s fallback) to keep it off the critical path -->
    <script>
      (function () {
        var loaded = false;
        function loadTidio() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.src = "https://code.tidio.co/lw711nytxv2efldcc8zzbnmkoaounxk9.js";
          s.async = true;
          document.body.appendChild(s);
          ["pointerdown", "scroll", "keydown", "touchstart"].forEach(function (e) {
            window.removeEventListener(e, loadTidio, { passive: true });
          });
        }
        ["pointerdown", "scroll", "keydown", "touchstart"].forEach(function (e) {
          window.addEventListener(e, loadTidio, { passive: true, once: true });
        });
        window.addEventListener("load", function () {
          setTimeout(loadTidio, 6000);
        });
      })();
    </script>
